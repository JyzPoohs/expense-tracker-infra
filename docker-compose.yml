version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: expense-keycloak

    command:
      - start-dev

    environment:
      KC_DB: mysql

      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db
      KC_HOSTNAME_URL: http://localhost:8180
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

    ports:
      - "8180:8080"

    depends_on:
      - mysql

volumes:
  mysql_data:
