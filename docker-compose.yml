version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: expense-keycloak

    command:
      - start-dev

    environment:
      KC_DB: mysql

      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db

      KC_DB_USERNAME: expenseuser
      KC_DB_PASSWORD: expensepass

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
  mysql_data:
